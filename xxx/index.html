<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Multitouch scroll – 2 paneles</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #111; color: #eee;
    font-family: system-ui, sans-serif;
    touch-action: none;               /* sin scroll ni zoom nativos */
    overscroll-behavior: none;
  }
  #app { display: flex; height: 100%; gap: 6px; padding: 6px; }
  .panel {
    position: relative; flex: 1; overflow: hidden;
    border-radius: 10px; background: #1c1c1c;
    touch-action: none;
  }
  .panel.active { outline: 3px solid #4fc3f7; }
  .content { will-change: transform; }
  .row {
    height: 90px; display: flex; align-items: center; padding: 0 20px;
    font-size: 28px; font-weight: 600; border-bottom: 1px solid rgba(0,0,0,.25);
  }
  .hud {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(0,0,0,.65); padding: 6px 10px; border-radius: 6px;
    font: 14px/1.3 monospace; pointer-events: none; white-space: pre;
  }
  .dot {
    position: fixed; width: 70px; height: 70px; margin: -35px 0 0 -35px;
    border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.15);
    pointer-events: none; z-index: 10;
  }
  #global {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: rgba(0,0,0,.75); padding: 6px 12px; border-radius: 6px;
    font: 14px monospace; pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<div id="app">
  <div class="panel" id="panelA"><div class="hud"></div><div class="content"></div></div>
  <div class="panel" id="panelB"><div class="hud"></div><div class="content"></div></div>
</div>
<div id="global">dedos: 0</div>

<script>
// ---------- Contenido de prueba ----------
function fill(panel, label, hueStart) {
  const c = panel.querySelector('.content');
  for (let i = 1; i <= 200; i++) {
    const r = document.createElement('div');
    r.className = 'row';
    r.style.background = `hsl(${(hueStart + i * 7) % 360} 55% 35%)`;
    r.textContent = `${label} · ${i}`;
    c.appendChild(r);
  }
}
fill(panelA, 'A', 0);
fill(panelB, 'B', 180);

// ---------- Scroller por panel ----------
class Scroller {
  constructor(panel) {
    this.panel = panel;
    this.content = panel.querySelector('.content');
    this.hud = panel.querySelector('.hud');
    this.y = 0;
    this.pointerId = null;
    this.lastY = 0;
    this.lastT = 0;
    this.velocity = 0;      // px por ms
    this.raf = 0;

    panel.addEventListener('pointerdown', e => this.down(e));
    panel.addEventListener('pointermove', e => this.move(e));
    panel.addEventListener('pointerup', e => this.up(e));
    panel.addEventListener('pointercancel', e => this.up(e));
    panel.addEventListener('lostpointercapture', e => this.up(e));
    this.render();
  }
  max() { return Math.max(0, this.content.scrollHeight - this.panel.clientHeight); }

  down(e) {
    if (this.pointerId !== null) return;            // un dedo por panel
    this.pointerId = e.pointerId;
    this.panel.setPointerCapture(e.pointerId);      // el dedo queda "atado" a este panel
    this.lastY = e.clientY;
    this.lastT = e.timeStamp;
    this.velocity = 0;
    cancelAnimationFrame(this.raf);
    this.panel.classList.add('active');
    this.render();
  }
  move(e) {
    if (e.pointerId !== this.pointerId) return;
    // usar eventos coalesced para más precisión si están disponibles
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const dy = this.lastY - ev.clientY;
      const dt = Math.max(1, ev.timeStamp - this.lastT);
      // suavizado de velocidad
      this.velocity = 0.8 * (dy / dt) + 0.2 * this.velocity;
      this.lastY = ev.clientY;
      this.lastT = ev.timeStamp;
      this.y += this.rubber(dy);
    }
    this.render();
  }
  up(e) {
    if (e.pointerId !== this.pointerId) return;
    this.pointerId = null;
    this.panel.classList.remove('active');
    // si el dedo quedó quieto antes de soltar, sin inercia
    if (performance.now() - this.lastT > 80) this.velocity = 0;
    this.fling();
  }
  // resistencia al pasarse de los bordes
  rubber(dy) {
    const m = this.max();
    if ((this.y < 0 && dy < 0) || (this.y > m && dy > 0)) return dy * 0.3;
    return dy;
  }
  fling() {
    let last = performance.now();
    const step = now => {
      const dt = Math.min(32, now - last); last = now;
      const m = this.max();
      if (this.y < 0 || this.y > m) {
        // volver al borde
        const target = this.y < 0 ? 0 : m;
        this.velocity = 0;
        this.y += (target - this.y) * 0.2;
        if (Math.abs(target - this.y) < 0.5) this.y = target;
      } else {
        this.y += this.velocity * dt;
        this.velocity *= Math.pow(0.995, dt);     // fricción
        if (Math.abs(this.velocity) < 0.02) this.velocity = 0;
      }
      this.render();
      const out = this.y < 0 || this.y > m;
      if (this.velocity !== 0 || out) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  render() {
    this.content.style.transform = `translate3d(0, ${-this.y}px, 0)`;
    this.hud.textContent =
      `${this.panel.id}\n` +
      `pointer: ${this.pointerId ?? '-'}\n` +
      `y: ${Math.round(this.y)}`;
  }
}

new Scroller(panelA);
new Scroller(panelB);

// ---------- Debug: círculos por dedo y contador ----------
const dots = new Map();
const globalHud = document.getElementById('global');
function updateGlobal() { globalHud.textContent = `dedos: ${dots.size}`; }

document.addEventListener('pointerdown', e => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.style.borderColor = `hsl(${(e.pointerId * 67) % 360} 90% 60%)`;
  document.body.appendChild(d);
  dots.set(e.pointerId, d);
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  updateGlobal();
}, true);
document.addEventListener('pointermove', e => {
  const d = dots.get(e.pointerId);
  if (d) { d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px'; }
}, true);
const removeDot = e => {
  const d = dots.get(e.pointerId);
  if (d) { d.remove(); dots.delete(e.pointerId); updateGlobal(); }
};
document.addEventListener('pointerup', removeDot, true);
document.addEventListener('pointercancel', removeDot, true);

// Bloquear gestos del navegador (menú contextual por long-press, zoom en iOS/Safari)
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
